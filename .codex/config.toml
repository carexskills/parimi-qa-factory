# Codex settings for this repo. Workspace edits only; network on so agents can open ParimiPractice.
sandbox_mode = "workspace-write"
approval_policy = "never"

[sandbox_workspace_write]
network_access = true

# The Playwright browser, connected through MCP (installed properly in lesson 2.4)
[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest", "--isolated", "--browser", "chromium"]
default_tools_approval_mode = "approve"
env_vars = ["DISPLAY", "PLAYWRIGHT_BROWSERS_PATH"]

# Playwright Test Agents' own tools (planner_setup_page, planner_save_plan, generator and healer tools) for .codex/agents/*.toml; headed so you can watch
[mcp_servers.playwright-test]
command = "npx"
args = ["playwright", "run-test-mcp-server"]
default_tools_approval_mode = "approve"
env_vars = ["DISPLAY", "PLAYWRIGHT_BROWSERS_PATH", "SLOWMO"]
env = { HEADED = "1" }
