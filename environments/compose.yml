services:
  app:
    image: parimipractice:1.0.0
    ports:
      - "${HOST_PORT}:8787"
    environment:
      APP_ENV: "${APP_ENV}"
      RESET_POLICY: "${RESET_POLICY}"
      SEED_VERSION: "${SEED_VERSION}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in the environment secrets file}"
      PARIMIPRACTICE_TOTP_SECRET: "${PARIMIPRACTICE_TOTP_SECRET:?Set PARIMIPRACTICE_TOTP_SECRET in the environment secrets file}"
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  app-data:
    name: "${DATA_VOLUME}"
